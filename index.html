<!DOCTYPE html>
<html>
<head>
    <title>BDO Map - Dynamic Tiles</title>
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            cursor: grab;
            user-select: none;
        }
        #map {
            position: absolute;
            transform-origin: 0 0;
            left: 50%;
            top: 50%;
        }
        img {
            position: absolute;
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map"></div>
</div>

<script>
const tileSize = 32;
const map = document.getElementById("map");
const viewport = document.getElementById("viewport");

const min = -50;
const max = 30;

let scale = 1;
let posX = -((max - min + 1) * tileSize) / 3;
let posY = -((max - min + 1) * tileSize) / 3;

const loadedTiles = new Map();   // Cache loaded images

function getTile(x, y) {
    const key = `${x},${y}`;
    if (loadedTiles.has(key)) return loadedTiles.get(key);

    const img = document.createElement("img");
    img.src = `tiles/${x}_${y}.webp`;
    img.style.left = (x * tileSize) + "px";
    img.style.top = (y * tileSize) + "px";
    img.draggable = false;
    
    map.appendChild(img);
    loadedTiles.set(key, img);
    return img;
}

function updateVisibleTiles() {
    const rect = viewport.getBoundingClientRect();
    
    // Calculate visible range in world coordinates
    const worldLeft   = -posX / scale;
    const worldRight  = (rect.width - posX) / scale;
    const worldTop    = -posY / scale;
    const worldBottom = (rect.height - posY) / scale;

    const tileMinX = Math.floor(worldLeft / tileSize) - 1;
    const tileMaxX = Math.ceil(worldRight / tileSize) + 1;
    const tileMinY = Math.floor(worldTop / tileSize) - 1;
    const tileMaxY = Math.ceil(worldBottom / tileSize) + 1;

    for (let x = Math.max(min, tileMinX); x <= Math.min(max, tileMaxX); x++) {
        for (let y = Math.max(min, tileMinY); y <= Math.min(max, tileMaxY); y++) {
            getTile(x, y);   // Load only if visible
        }
    }
}

function updateTransform() {
    map.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    updateVisibleTiles();
}

// Initial load
updateTransform();

// ==================== ZOOM ====================
viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const worldX = (mouseX - posX) / scale;
    const worldY = (mouseY - posY) / scale;

    const delta = e.deltaY * -0.0015;
    scale = Math.min(Math.max(0.2, scale + delta), 10);

    posX = mouseX - worldX * scale;
    posY = mouseY - worldY * scale;

    updateTransform();
});

// ==================== DRAG ====================
let isDragging = false;
let lastX, lastY;

viewport.addEventListener("mousedown", e => {
    if (e.button === 0) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        viewport.style.cursor = "grabbing";
    }
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    viewport.style.cursor = "grab";
});

window.addEventListener("mousemove", e => {
    if (!isDragging) return;
    posX += e.clientX - lastX;
    posY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    updateTransform();
});

// Info
const info = document.createElement("div");
info.style.cssText = `position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.7);padding:8px 12px;border-radius:4px;`;
info.textContent = "Hold click to drag • Scroll to zoom";
document.body.appendChild(info);
</script>

</body>
</html>
