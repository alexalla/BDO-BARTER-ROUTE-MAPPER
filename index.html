<!DOCTYPE html>
<html>
<head>
    <title>BDO Map - Fixed Initial View</title>
    <style>
        body { margin:0; background:#111; overflow:hidden; height:100vh; width:100vw; }
        canvas { display:block; image-rendering:pixelated; cursor:grab; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.9); padding: 20px 30px; border-radius: 10px;
            z-index: 1000; font-family: Arial;
        }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; z-index: 100;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="loading">Loading central area...</div>
<div id="info">Hold click to drag • Scroll to zoom</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const loading = document.getElementById("loading");

const tileSize = 16;
const min = -50;
const max = 30;

let scale = 6.0;
let offsetX = 0;
let offsetY = 0;

const tiles = new Map();

// ==================== CITIES POI) ====================
const pois = [
    { x: 0,   y: 0,   name: "Test Center",      type: "node",     color: "#00ff00" },
    { x: -10.7,  y: -1,   name: "Port Epheria",           type: "town",     color: "#4488ff" },
    { x: 0.5,   y: -2.4, name: "Velia",            type: "town",     color: "#4488ff" },
    { x: 4.5,  y: -8.8,  name: "Iliya Island",     type: "town",   color: "#4488ff" },
// ==================== ISLANDS ====================

	{ x: 7.7, y: -8.7, name: "Pujara Island", color: "#ff4444" },
	{ x: 7.5, y: -5.8, name: "Pilava Island", color: "#ff4444" },
	{ x: 6.1, y: -6, name: "Delinghart Island", color: "#ff4444" },
    // Add more POIs here like this:
    // { x: 12.5, y: -8.3, name: "Western Guard Camp", color: "#ff4444" },
];

function getTile(x, y) {
    const key = `${x},${y}`;
    if (tiles.has(key)) return tiles.get(key);

    const img = new Image();
    img.src = `tiles/${x}_${y}.webp`;
    tiles.set(key, img);
    return img;
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    offsetX = canvas.width / 2;
    offsetY = canvas.height / 2;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const worldLeft   = -offsetX / scale - 100;
    const worldRight  = (canvas.width - offsetX) / scale + 100;
    const worldTop    = -offsetY / scale - 100;
    const worldBottom = (canvas.height - offsetY) / scale + 100;

    const tMinX = Math.max(min, Math.floor(worldLeft / tileSize));
    const tMaxX = Math.min(max, Math.ceil(worldRight / tileSize));
    const tMinY = Math.max(min, Math.floor(worldTop / tileSize));
    const tMaxY = Math.min(max, Math.ceil(worldBottom / tileSize));

    for (let x = tMinX; x <= tMaxX; x++) {
        for (let y = tMinY; y <= tMaxY; y++) {
            const img = getTile(x, y);
            if (img.complete && img.width > 0) {
                const sx = offsetX + x * tileSize * scale;
                const sy = offsetY + y * tileSize * scale;
                ctx.drawImage(img, sx, sy, tileSize * scale, tileSize * scale);
            }
        }
    }

    // ==================== DRAW POIs ====================
    ctx.textAlign = "center";
    ctx.font = `${Math.max(13, scale * 1.6)}px Arial`;

    pois.forEach(poi => {
        const screenX = offsetX + poi.x * tileSize * scale;
        const screenY = offsetY + poi.y * tileSize * scale;

        if (screenX < -100 || screenX > canvas.width + 100 || 
            screenY < -100 || screenY > canvas.height + 100) return;

        // Icon
        ctx.fillStyle = poi.color || "#ffcc00";
        ctx.beginPath();
        ctx.arc(screenX, screenY, Math.max(7, scale * 1.4), 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Label
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        ctx.strokeText(poi.name, screenX, screenY - 22);
        ctx.fillText(poi.name, screenX, screenY - 22);
    });
}

// Controls
let isDragging = false;
let lastX, lastY;

canvas.addEventListener("mousedown", e => {
    if (e.button === 0) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.style.cursor = "grabbing";
    }
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    canvas.style.cursor = "grab";
});

window.addEventListener("mousemove", e => {
    if (!isDragging) return;
    offsetX += e.clientX - lastX;
    offsetY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    draw();
});

canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const wx = (mx - offsetX) / scale;
    const wy = (my - offsetY) / scale;

    scale = Math.min(Math.max(0.5, scale + e.deltaY * -0.0025), 30);
    offsetX = mx - wx * scale;
    offsetY = my - wy * scale;
    draw();
});

window.addEventListener("resize", () => { resize(); draw(); });

// Init
resize();

// Load small central area
const initialRange = 5; 
for (let x = -initialRange; x <= initialRange; x++) {
    for (let y = -initialRange; y <= initialRange; y++) {
        getTile(x, y);
    }
}

// Force multiple draws so it appears immediately
draw();
setTimeout(draw, 100);
setTimeout(draw, 300);
setTimeout(draw, 600);

// Hide loading
setTimeout(() => {
    loading.style.display = "none";
}, 800);
</script>

</body>
</html>
